<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
<script src="./neon.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="uploads/vantage-icon.png">
  <link rel="apple-touch-icon" href="uploads/vantage-icon.png">
  <style>
    body { margin: 0; background: #F7F6F2; -webkit-font-smoothing: antialiased; }
    a { color: #159B5A; }
    a:hover { color: #0E1F2B; }

    @keyframes pdShimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  </style>
  <script>
    (function () {
      function hide() { var el = document.getElementById('pd-skeleton'); if (!el) return; el.style.opacity = '0'; setTimeout(function () { if (el && el.parentNode) el.parentNode.removeChild(el); }, 400); }
      if (document.readyState === 'complete') { setTimeout(hide, 650); }
      else { window.addEventListener('load', function () { setTimeout(hide, 650); }); }
      setTimeout(hide, 3000);
    })();
  </script>
</helmet>

<div style="font-family: Inter, sans-serif; color: #0E1F2B; background: #F7F6F2; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 24px; box-sizing: border-box;" data-screen-label="Login">
  <div id="pd-skeleton" style="position:fixed;inset:0;z-index:200;background:#F7F6F2;pointer-events:none;transition:opacity 0.4s ease;display:flex;align-items:center;justify-content:center;padding:40px 24px;box-sizing:border-box;">
    <div style="width:100%;max-width:440px;display:flex;flex-direction:column;gap:24px;">
      <div style="display:flex;flex-direction:column;gap:12px;align-items:center;"><div style="width:210px;height:28px;border-radius:8px;background:linear-gradient(90deg,#E8E4DA 25%,#F4F1EA 50%,#E8E4DA 75%);background-size:200% 100%;animation:pdShimmer 1.3s ease-in-out infinite;"></div><div style="width:300px;height:14px;border-radius:6px;background:linear-gradient(90deg,#E8E4DA 25%,#F4F1EA 50%,#E8E4DA 75%);background-size:200% 100%;animation:pdShimmer 1.3s ease-in-out infinite;"></div></div>
      <div style="width:100%;height:380px;border-radius:16px;background:linear-gradient(90deg,#E8E4DA 25%,#F4F1EA 50%,#E8E4DA 75%);background-size:200% 100%;animation:pdShimmer 1.3s ease-in-out infinite;"></div>
    </div>
  </div>


  <div style="width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 26px;">

    <div style="text-align: center;">
      <img src="uploads/vantage-logo-dark.png" alt="Vantage, Market Analysis" style="width: 280px; max-width: 100%; height: auto; display: block; margin: 0 auto 8px;">
      <p style="margin: 0; font-size: 14px; color: #6B7480; line-height: 1.6;">Pick your profile to continue, or start a new one.</p>
    </div>

    <div style="background: #FFFFFF; border: 1px solid #ECE8DE; border-radius: 16px; padding: 32px; box-shadow: 0 1px 3px rgba(14,31,43,0.05); display: flex; flex-direction: column; gap: 22px;">

      <!-- PROFILES -->
      <sc-if value="{{ hasProfiles }}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; flex-direction: column; gap: 10px;">
          <span style="font-size: 11.5px; font-weight: 600; color: #A9A294; letter-spacing: 0.06em; text-transform: uppercase;">Your profiles</span>
          <div style="display: flex; flex-direction: column; gap: 10px;">
            <sc-for list="{{ profiles }}" as="p" hint-placeholder-count="2">
              <button onClick="{{ p.onPick }}" style="font-family: inherit; text-align: left; background: #FFFFFF; border: 1px solid #E6E2D8; border-radius: 10px; padding: 12px 14px; cursor: pointer; display: flex; align-items: center; gap: 12px;" style-hover="border-color: #159B5A; background: #F4FAF6;">
                <span style="width: 34px; height: 34px; border-radius: 50%; background: {{ p.avatarBg }}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; flex-shrink: 0;">{{ p.initial }}</span>
                <span style="display: flex; flex-direction: column; gap: 1px; min-width: 0; flex: 1;">
                  <span style="font-size: 13.5px; font-weight: 600; color: #0E1F2B;">{{ p.name }}</span>
                  <span style="font-size: 11px; color: #A9A294;">{{ p.account }}</span>
                </span>
                <span style="font-size: 14px; color: #A9A294;">&rarr;</span>
              </button>
            </sc-for>
          </div>
        </div>
      </sc-if>

      <sc-if value="{{ loading }}" hint-placeholder-val="{{ false }}">
        <span style="font-size: 12.5px; color: #A9A294;">Loading profiles&hellip;</span>
      </sc-if>

      <!-- NEW PROFILE -->
      <div style="display: flex; flex-direction: column; gap: 10px; padding-top: {{ createPadTop }}; border-top: {{ createBorderTop }};">
        <span style="font-size: 11.5px; font-weight: 600; color: #A9A294; letter-spacing: 0.06em; text-transform: uppercase;">{{ createHeading }}</span>
        <div style="display: flex; gap: 8px;">
          <input type="text" value="{{ username }}" onChange="{{ onUsername }}" onKeyDown="{{ onKey }}" placeholder="Your name" autocapitalize="words" style="flex: 1; font-family: inherit; font-size: 14px; color: #0E1F2B; background: #FFFFFF; border: 1px solid {{ userBorder }}; border-radius: 8px; padding: 12px 14px; outline: none; min-width: 0;" style-focus="border-color: #159B5A;">
          <button onClick="{{ onSubmit }}" style="font-family: inherit; font-size: 14px; font-weight: 600; color: #F7F6F2; background: #0E1F2B; border: none; border-radius: 8px; padding: 12px 20px; cursor: pointer; letter-spacing: 0.01em; white-space: nowrap;" style-hover="background: #159B5A;">Create</button>
        </div>
        <span style="min-height: 18px; font-size: 12.5px; color: {{ msgColor }}; line-height: 1.45;">{{ message }}</span>
      </div>

    </div>

    <p style="margin: 0; text-align: center; font-size: 12px; color: #A9A294; line-height: 1.6;">This site is locked by its site password, profiles just keep dashboards separate.<br>Prepared privately &middot; not financial advice</p>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { profiles: null, username: '', message: '', msgError: false };

  readSession() {
    var raw = null;
    try { raw = localStorage.getItem('pd-session'); } catch (e) {}
    if (!raw) { try { raw = sessionStorage.getItem('pd-session'); } catch (e) {} }
    if (!raw && window.name && window.name.indexOf('pd-session:') === 0) raw = window.name.slice(11);
    return raw;
  }

  persistSession(json) {
    var saved = false;
    try { localStorage.setItem('pd-session', json); saved = true; } catch (e) {}
    if (!saved) { try { sessionStorage.setItem('pd-session', json); saved = true; } catch (e) {} }
    if (!saved) window.name = 'pd-session:' + json;
  }

  componentDidMount() {
    var self = this;
    if (this.readSession()) { window.location.replace('Overview.dc.html'); return; }
    VantageDB.listAccounts().then(function (list) {
      self.setState({ profiles: list || [] });
    }).catch(function () {
      self.setState({ profiles: [], message: 'Couldn’t reach the profile service, you can still create a profile.', msgError: true });
    });
  }

  pickProfile(u) {
    this.persistSession(JSON.stringify({ name: u.name, account: u.account }));
    window.location.href = 'Overview.dc.html';
  }

  createProfile() {
    var self = this;
    var raw = this.state.username.trim();
    var uname = raw.toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9_.-]/g, '');
    if (!raw) { this.setState({ message: 'Enter a name for the new profile.', msgError: true }); return; }
    if (uname.length < 2 || uname.length > 24) { this.setState({ message: 'Name should be 2–24 characters.', msgError: true }); return; }
    this.setState({ message: 'Creating your profile…', msgError: false });
    var num = 'PD-' + String(10000 + Math.floor(Math.random() * 89999));
    VantageDB.createAccount({ username: uname, name: raw, account: num }).then(function (res) {
      if (!res.ok) {
        var msg = res.error === 'taken' ? 'A profile with that name already exists, tap it above instead.' : 'Couldn’t reach the profile service. Try again.';
        self.setState({ message: msg, msgError: true });
        return;
      }
      self.persistSession(JSON.stringify({ name: raw, account: num }));
      window.location.href = 'Onboarding.dc.html';
    }).catch(function () {
      self.setState({ message: 'Couldn’t reach the profile service. Try again.', msgError: true });
    });
  }

  renderVals() {
    var st = this.state;
    var self = this;

    var avatarColors = ['#0E1F2B', '#7FA8C9', '#159B5A', '#C9A227', '#B4483C', '#6B5B95'];
    var profiles = (st.profiles || []).map(function (u, i) {
      return {
        name: u.name,
        account: u.account,
        initial: (u.name || '?').charAt(0).toUpperCase(),
        avatarBg: avatarColors[i % avatarColors.length],
        onPick: function () { self.pickProfile(u); },
      };
    });
    var hasProfiles = profiles.length > 0;
    var loading = st.profiles === null;

    return {
      profiles: profiles,
      hasProfiles: hasProfiles,
      loading: loading,

      createHeading: hasProfiles ? 'New profile' : 'Create your profile',
      createPadTop: (hasProfiles || loading) ? '18px' : '0px',
      createBorderTop: (hasProfiles || loading) ? '1px solid #F0EDE4' : 'none',

      username: st.username,
      message: st.message,
      msgColor: st.msgError ? '#B4483C' : '#159B5A',
      userBorder: st.msgError ? '#B4483C' : '#E6E2D8',

      onUsername: function (e) { this.setState({ username: e.target.value, message: '' }); }.bind(this),
      onKey: function (e) { if (e.key === 'Enter') this.createProfile(); }.bind(this),
      onSubmit: function () { this.createProfile(); }.bind(this),
    };
  }
}
</script>
</body>
</html>
